# Next.js 16 requires Node >= 20.9.0 (see next/package.json "engines"). Pin it
# explicitly so the build doesn't depend on whatever Node version Netlify
# defaults to.
[build.environment]
  NODE_VERSION = "20.9.0"

# Make the Next.js runtime explicit rather than relying only on Netlify's
# dashboard-side auto-detection, which is a common source of drift.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Standalone functions (outside the Next.js app) — currently just the daily
# Google Ads snapshot puller, which needs a cron schedule Next.js route
# handlers can't declare on Netlify.
[functions]
  directory = "netlify/functions"

# No app-level www/apex redirect here on purpose: Netlify's dashboard
# (Domain management) already redirects www.efloor.id -> efloor.id at the
# platform level. Adding the reverse redirect here previously caused an
# infinite redirect loop (ERR_TOO_MANY_REDIRECTS) — each side kept sending
# the browser back to the other host. SITE_URL in app/seo.config.ts must
# stay in sync with whichever host is actually primary in the dashboard.

# Long-lived caching for hashed Next.js build assets and static images —
# these paths are content-hashed or effectively immutable, so it's safe to
# cache them for a year at the edge/browser.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Analytics and Google Ads conversion tracking only run where this is "true".
# Deploy previews and branch deploys deliberately leave it unset so test
# clicks there never file conversions against the live Ads account.
[context.production.environment]
  NEXT_PUBLIC_ENABLE_TRACKING = "true"
